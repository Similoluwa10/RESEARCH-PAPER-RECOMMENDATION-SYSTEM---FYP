version: '3.8'

services:
  research_recommender_api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: research_recommender_api
    environment:
      # Database URL is now read from .env file (Neon hosted)
      - APP_ENV=development
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/api:/app
      - ../../packages/nlp:/packages/nlp
      - ../../packages/shared:/packages/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  research_recommender_web:
    build:
      context: ../../apps/web
      dockerfile: ../../infrastructure/docker/Dockerfile.web
    container_name: research_recommender_web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - research_recommender_api
    command: npm run dev
