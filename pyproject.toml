[project]
name = "research-recommender-api"
version = "0.1.0"
description = "FastAPI backend for Research Paper Recommendation System"
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "psycopg[binary]==3.2.3",
    "click>=8.5.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
